[package]
name = "tauri-pencil-tests"
version = "0.1.0"
description = "Tauri iOS Apple Pencil detection demo"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_pencil_tests_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-pencil = { path = "../tauri-plugin-pencil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
